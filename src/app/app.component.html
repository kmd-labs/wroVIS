@let t = i18n.t();

<main class="viewport">
  <app-splash></app-splash>

  <!-- Fullscreen Visualization Stage: MapLibre canvas -->
  <app-map-stage class="stage" role="region" [attr.aria-label]="t.stageAriaLabel"></app-map-stage>
  <app-map-tooltip></app-map-tooltip>

  <!-- Top HUD: Left Logotype + Language, Right View Switcher -->
  <header class="header" #header [class.header--popup-open]="isPopupOpen()">
    <div class="header__left">
      <app-brand
        [appName]="'wroVIS'"
        [lang]="i18n.lang()"
        (btnClick)="about.open({ lang: i18n.lang() })">
      </app-brand>

      <div class="header__settings glass-panel" role="group" [attr.aria-label]="t.changeLanguage">
        <app-dropdown
          variant="ghost"
          [icon]="bp.mobile() ? null : globeIcon"
          [options]="langOptions()"
          [value]="i18n.lang()"
          [ariaLabel]="t.changeLanguage"
          (valueChange)="i18n.setLang($event)">
        </app-dropdown>
      </div>
    </div>

    <div class="header__right">
      <div class="header__view glass-panel">
        <app-dropdown
          variant="ghost"
          align="right"
          [fullWidth]="true"
          [options]="viewOptions()"
          [value]="state.currentView()"
          [icon]="currentViewIcon()"
          [ariaLabel]="t.chooseView"
          (valueChange)="state.setView($event)">
        </app-dropdown>
      </div>
    </div>
  </header>

  <!-- Bottom Dock: view context, parameter slider with presets, legend and glossary -->
  <footer class="dock-wrap">
    <div class="dock glass-panel" #dock>
      <div class="dock__main">
        <div class="dock__head">
          <lucide-icon class="dock__icon" [img]="currentViewIcon()" [size]="16"></lucide-icon>
          <div class="dock__titles">
            <span class="dock__title">{{ viewTitle() }}</span>
            <span class="dock__desc">{{ viewDesc() }}</span>
          </div>
          @if (state.currentView() === 'cyberpunk') {
            <app-switcher
              class="dock__switcher"
              size="sm"
              [options]="paletteOptions()"
              [value]="state.params().cyberPalette"
              [ariaLabel]="t.palette"
              (valueChange)="onPaletteChange($event)">
            </app-switcher>
          }
        </div>

        <div class="dock__slider">
          <div class="dock__slider-head">
            <span class="dock__slider-label">{{ sliderLabel() }}</span>
            <span class="dock__value">{{ sliderReadout() }}</span>
          </div>
          <app-timeline-slider
            [min]="slider().min"
            [max]="slider().max"
            [step]="slider().step"
            [value]="sliderValue()"
            [markers]="sliderMarkers()"
            [trackGradient]="sliderRail"
            [ariaLabel]="sliderLabel()"
            (valueChange)="onSliderChange($event)"
            (markerClick)="onMarkerClick($event)">
            <app-button
              timelineAction
              variant="ghost"
              [iconOnly]="true"
              [ariaLabel]="t.glossary"
              [titleText]="t.glossary"
              (btnClick)="openGlossary()">
              <lucide-icon [img]="bookOpenIcon" [size]="15"></lucide-icon>
            </app-button>
          </app-timeline-slider>
        </div>
      </div>

      <div class="dock__legend" [class.dock__legend--wide]="legendWide()">
        <span class="dock__legend-title">{{ t.legend }}</span>
        <app-legend [spec]="legend()"></app-legend>
      </div>
    </div>
  </footer>

  <app-popup [closeAriaLabel]="t.close"></app-popup>
  <app-tooltip></app-tooltip>
</main>
